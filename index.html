const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const K="lr-key-v1";
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let raw=null;try{raw=localStorage.getItem(K)}catch(e){}
  if(raw){try{const k=await crypto.subtle.importKey("raw",u(raw),"AES-GCM",false,["decrypt"]);await open(k);return}catch(e){try{localStorage.removeItem(K)}catch(x){}}}
  document.getElementById("p").focus();
})();
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault();const E=document.getElementById("e");E.textContent="Entschlüssele…";
  try{
    const k=await fromPw(document.getElementById("p").value);
    if(document.getElementById("r").checked){try{localStorage.setItem(K,b(await crypto.subtle.exportKey("raw",k)))}catch(e){}}
    await open(k);
  }catch(e){E.textContent="Falsches Passwort."}
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
